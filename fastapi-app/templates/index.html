<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPS COMMAND - Task Board</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-deep:    #11140c;
            --bg-base:    #1a1d14;
            --bg-card:    #262b1d;
            --bg-input:   #11140c;
            --border:     #4a5320;
            --border-hi:  #8a9550;
            --text:       #d4dcb0;
            --text-dim:   #8a9265;
            --text-mute:  #565c3e;
            --accent:     #a3b86c;
            --danger:     #b04d2c;
            --warning:    #c19432;
            --success:    #6e8a32;
            --info:       #5e8186;
        }

        body {
            font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
            background:
                repeating-linear-gradient(0deg, transparent 0, transparent 24px, rgba(74,83,32,0.04) 24px, rgba(74,83,32,0.04) 25px),
                var(--bg-base);
            min-height: 100vh;
            color: var(--text);
            padding: 32px 16px;
            line-height: 1.4;
        }

        .container {
            width: 100%;
            max-width: 880px;
            margin: 0 auto;
        }

        /* ── 군대식 헤더 ── */
        .classified-bar {
            background: var(--danger);
            color: #1a1d14;
            font-weight: 800;
            font-size: 11px;
            letter-spacing: 4px;
            text-align: center;
            padding: 4px 0;
            border: 2px solid var(--danger);
            margin-bottom: 0;
        }

        .header {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-top: none;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
        }

        .header .stencil {
            font-size: 10px;
            color: var(--text-mute);
            letter-spacing: 6px;
            margin-bottom: 4px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 3px;
            margin-bottom: 6px;
            text-shadow: 0 0 12px rgba(163, 184, 108, 0.3);
        }

        .header .sub {
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header .sub::before { content: '── '; }
        .header .sub::after  { content: ' ──'; }

        /* ── 상태 패널 ── */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .stat-badge {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-left: 4px solid var(--accent);
            padding: 12px 14px;
        }

        .stat-badge .num {
            font-size: 24px;
            font-weight: 800;
            color: var(--accent);
            font-family: inherit;
        }

        .stat-badge .label {
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        /* ── 임무 등록 폼 ── */
        .form-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        .form-card::before {
            content: 'CLASSIFIED // FOR OFFICIAL USE';
            position: absolute;
            top: -1px;
            right: 12px;
            font-size: 8px;
            color: var(--text-mute);
            background: var(--bg-card);
            padding: 0 6px;
            letter-spacing: 1.5px;
        }

        .form-card .section-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 8px;
        }

        .form-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .form-card input[type="text"],
        .form-card input[type="date"] {
            flex: 1;
            min-width: 120px;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1.5px solid var(--border);
            font-family: inherit;
            font-size: 13px;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s;
            color-scheme: dark;
        }

        .form-card input::placeholder { color: var(--text-mute); }
        .form-card input:focus { border-color: var(--accent); }

        .date-row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .date-label {
            font-size: 10px;
            color: var(--text-dim);
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .date-separator { color: var(--text-mute); font-weight: bold; }

        .btn-add {
            padding: 10px 24px;
            background: var(--accent);
            color: #11140c;
            border: 2px solid var(--accent);
            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
        }

        .btn-add:hover {
            background: transparent;
            color: var(--accent);
            box-shadow: inset 0 0 0 2px var(--accent);
        }

        /* ── 필터 탭 ── */
        .filter-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 16px;
            border: 2px solid var(--border);
            background: var(--bg-card);
        }

        .tab {
            flex: 1;
            padding: 10px;
            border: none;
            border-right: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .tab:last-child { border-right: none; }
        .tab:hover { color: var(--text); background: rgba(163, 184, 108, 0.05); }

        .tab.active {
            background: var(--accent);
            color: #11140c;
            font-weight: 800;
        }

        /* ── 임무 카드 ── */
        .todo-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-left: 5px solid var(--text-mute);
            padding: 14px 16px;
            margin-bottom: 8px;
            transition: border-color 0.15s, background 0.15s;
            position: relative;
        }

        .todo-card:hover {
            border-color: var(--border-hi);
            background: #2d3322;
        }

        .todo-card.completed { opacity: 0.45; border-left-color: var(--text-mute); }
        .todo-card.overdue   { border-left-color: var(--danger); }
        .todo-card.due-today { border-left-color: var(--warning); }
        .todo-card.on-track  { border-left-color: var(--success); }

        .todo-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        /* 체크박스(군용 표적 스타일) */
        .toggle {
            width: 22px;
            height: 22px;
            min-width: 22px;
            border-radius: 0;
            border: 2px solid var(--border-hi);
            background: var(--bg-input);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 2px;
            transition: all 0.15s;
            position: relative;
        }

        .toggle:hover { border-color: var(--accent); }

        .toggle.done {
            background: var(--accent);
            border-color: var(--accent);
        }

        .toggle.done::after {
            content: '✓';
            color: #11140c;
            font-weight: 900;
            font-size: 14px;
        }

        .todo-text { flex: 1; min-width: 0; }

        .todo-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }

        .todo-card.completed .todo-title {
            text-decoration: line-through;
            color: var(--text-mute);
        }

        .todo-desc {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .date-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid;
            font-family: inherit;
        }

        .date-badge.overdue   { background: rgba(176,77,44,0.15);   color: var(--danger);  border-color: var(--danger); }
        .date-badge.due-today { background: rgba(193,148,50,0.15);  color: var(--warning); border-color: var(--warning); }
        .date-badge.on-track  { background: rgba(110,138,50,0.15);  color: var(--success); border-color: var(--success); }
        .date-badge.no-date   { background: rgba(74,83,32,0.10);    color: var(--text-dim); border-color: var(--border); }

        .todo-actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-icon {
            padding: 6px 12px;
            border: 1.5px solid;
            background: var(--bg-input);
            font-family: inherit;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-edit { color: var(--info);   border-color: var(--info); }
        .btn-edit:hover { background: var(--info); color: #11140c; }
        .btn-del { color: var(--danger); border-color: var(--danger); }
        .btn-del:hover  { background: var(--danger); color: #11140c; }

        /* ── 통신/보고 (댓글) ── */
        .comments-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border);
        }

        .comments-section::before {
            content: '[ TRANSMISSION LOG ]';
            font-size: 9px;
            color: var(--text-mute);
            letter-spacing: 2px;
            display: block;
            margin-bottom: 6px;
        }

        .comment-item {
            font-size: 12px;
            color: var(--text-dim);
            padding: 6px 10px;
            background: var(--bg-input);
            border-left: 2px solid var(--info);
            margin-bottom: 4px;
            font-family: inherit;
        }

        .comment-form {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .comment-form input {
            flex: 1;
            padding: 7px 10px;
            background: var(--bg-input);
            border: 1.5px solid var(--border);
            font-family: inherit;
            font-size: 12px;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s;
        }

        .comment-form input::placeholder { color: var(--text-mute); }
        .comment-form input:focus { border-color: var(--accent); }

        .btn-comment {
            padding: 7px 14px;
            background: transparent;
            color: var(--info);
            border: 1.5px solid var(--info);
            font-family: inherit;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .btn-comment:hover { background: var(--info); color: #11140c; }

        .empty {
            text-align: center;
            color: var(--text-mute);
            font-size: 12px;
            padding: 40px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: 2px dashed var(--border);
            background: var(--bg-card);
        }

        /* ── 작전 캘린더 ── */
        .calendar-section { margin-top: 40px; }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border);
        }

        .section-header h2 {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .section-header h2::before { content: '▌ '; color: var(--accent); }

        .cal-nav {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cal-nav button {
            width: 32px;
            height: 32px;
            border-radius: 0;
            border: 2px solid var(--border);
            background: var(--bg-card);
            color: var(--accent);
            font-family: inherit;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cal-nav button:hover {
            background: var(--accent);
            color: #11140c;
            border-color: var(--accent);
        }

        .cal-nav .month-label {
            font-size: 13px;
            font-weight: 800;
            color: var(--text);
            min-width: 130px;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .calendar {
            background: var(--bg-card);
            border: 2px solid var(--border);
        }

        .cal-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: var(--bg-input);
            border-bottom: 2px solid var(--border);
        }

        .cal-weekday {
            text-align: center;
            padding: 10px 4px;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .cal-weekday:first-child { color: var(--danger); }
        .cal-weekday:last-child  { color: var(--info); }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .cal-day {
            min-height: 88px;
            padding: 6px;
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            position: relative;
            transition: background 0.15s;
        }

        .cal-day:hover { background: rgba(163, 184, 108, 0.04); }
        .cal-day:nth-child(7n) { border-right: none; }

        .cal-day.other-month .day-num { color: var(--text-mute); opacity: 0.4; }

        .cal-day.today {
            background: rgba(163, 184, 108, 0.08);
            box-shadow: inset 0 0 0 2px var(--accent);
        }

        .cal-day.today .day-num {
            color: var(--accent);
            font-weight: 900;
        }

        .day-num {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dim);
            margin-bottom: 4px;
            display: block;
        }

        .cal-day:nth-child(7n+1) .day-num { color: var(--danger); }
        .cal-day:nth-child(7n) .day-num   { color: var(--info); }

        .cal-todo-chip {
            display: block;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: default;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: inherit;
        }

        .cal-todo-chip.start { background: rgba(94, 129, 134, 0.2);  color: var(--info);    border-left: 3px solid var(--info); }
        .cal-todo-chip.end   { background: rgba(193, 148, 50, 0.2);  color: var(--warning); border-left: 3px solid var(--warning); }
        .cal-todo-chip.both  { background: rgba(110, 138, 50, 0.2);  color: var(--success); border-left: 3px solid var(--success); }
        .cal-todo-chip.done  { background: rgba(74,83,32,0.10);      color: var(--text-mute); border-left: 3px solid var(--text-mute); text-decoration: line-through; }

        /* ── 모달 (브리핑) ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--bg-card);
            border: 2px solid var(--accent);
            padding: 24px;
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            box-shadow: 0 0 32px rgba(163, 184, 108, 0.2);
        }

        .modal::before {
            content: '◆ MISSION EDIT ◆';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-base);
            padding: 0 12px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--accent);
        }

        .modal h2 {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 10px;
        }

        .modal label {
            font-size: 10px;
            color: var(--text-dim);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .modal input {
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1.5px solid var(--border);
            font-family: inherit;
            font-size: 13px;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s;
            color-scheme: dark;
        }

        .modal input:focus { border-color: var(--accent); }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 4px;
        }

        .btn-cancel {
            padding: 10px 18px;
            background: var(--bg-input);
            color: var(--text-dim);
            border: 1.5px solid var(--border);
            font-family: inherit;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-cancel:hover { border-color: var(--danger); color: var(--danger); }

        .btn-save {
            padding: 10px 18px;
            background: var(--accent);
            color: #11140c;
            border: 1.5px solid var(--accent);
            font-family: inherit;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-save:hover { background: transparent; color: var(--accent); }

        .divider { display: none; }

        /* 로그아웃 링크 */
        .logout-bar {
            text-align: right;
            margin-bottom: 12px;
        }
        .logout-bar a {
            font-size: 10px;
            color: var(--text-mute);
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid var(--border);
            padding: 4px 10px;
            transition: all 0.15s;
        }
        .logout-bar a:hover { color: var(--danger); border-color: var(--danger); }
    </style>
</head>
<body>
    <div class="container">

        <!-- 로그아웃 -->
        <div class="logout-bar">
            <a href="/logout">▶ 로그아웃 / SIGN OUT</a>
        </div>

        <!-- 군대식 헤더 -->
        <div class="classified-bar">// CLASSIFIED // OPERATIONS COMMAND //</div>
        <div class="header">
            <div class="stencil">[ TASK FORCE COMMAND CENTER ]</div>
            <h1>✦ Task Board</h1>
            <div class="sub" id="today-label"></div>
        </div>

        <!-- 작전 현황 -->
        <div class="stats">
            <div class="stat-badge"><div class="num" id="stat-total">0</div><div class="label">TOTAL OPS / 전체</div></div>
            <div class="stat-badge"><div class="num" id="stat-done">0</div><div class="label">CLEARED / 완료</div></div>
            <div class="stat-badge"><div class="num" id="stat-overdue">0</div><div class="label">OVERDUE / 기한초과</div></div>
            <div class="stat-badge"><div class="num" id="stat-today">0</div><div class="label">DUE TODAY / 오늘마감</div></div>
        </div>

        <!-- 임무 등록 -->
        <div class="form-card">
            <div class="section-title">▶ NEW MISSION / 임무 등록</div>
            <div class="form-row">
                <input type="text" id="title" placeholder="MISSION TITLE / 임무 제목" required>
                <input type="text" id="description" placeholder="BRIEFING / 설명 (선택)">
            </div>
            <div class="date-row">
                <span class="date-label">START / 개시</span>
                <input type="date" id="start_date">
                <span class="date-separator">≫</span>
                <span class="date-label">END / 종료</span>
                <input type="date" id="end_date">
            </div>
            <button class="btn-add" onclick="addTodo()">▶ EXECUTE / 등록</button>
        </div>

        <!-- 필터 탭 -->
        <div class="filter-tabs">
            <button class="tab active" onclick="setFilter('all', this)">ALL / 전체</button>
            <button class="tab" onclick="setFilter('active', this)">ACTIVE / 진행중</button>
            <button class="tab" onclick="setFilter('done', this)">CLEARED / 완료</button>
            <button class="tab" onclick="setFilter('overdue', this)">OVERDUE / 기한초과</button>
        </div>

        <div id="todo-list"></div>

        <div class="divider"></div>

        <!-- 작전 캘린더 -->
        <div class="calendar-section">
            <div class="section-header">
                <h2>OPS SCHEDULE / 작전 일정</h2>
                <div class="cal-nav">
                    <button onclick="changeMonth(-1)">◀</button>
                    <span class="month-label" id="month-label"></span>
                    <button onclick="changeMonth(1)">▶</button>
                </div>
            </div>
            <div class="calendar">
                <div class="cal-weekdays">
                    <div class="cal-weekday">Sun</div>
                    <div class="cal-weekday">Mon</div>
                    <div class="cal-weekday">Tue</div>
                    <div class="cal-weekday">Wed</div>
                    <div class="cal-weekday">Thu</div>
                    <div class="cal-weekday">Fri</div>
                    <div class="cal-weekday">Sat</div>
                </div>
                <div class="cal-grid" id="cal-grid"></div>
            </div>
        </div>
    </div>

    <!-- 수정 모달 -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2>MISSION EDIT / 임무 수정</h2>
            <label>TITLE / 제목 <input type="text" id="m-title"></label>
            <label>BRIEFING / 설명 <input type="text" id="m-desc"></label>
            <label>START / 개시일 <input type="date" id="m-start"></label>
            <label>END / 종료일 <input type="date" id="m-end"></label>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">ABORT / 취소</button>
                <button class="btn-save" onclick="saveEdit()">CONFIRM / 저장</button>
            </div>
        </div>
    </div>

    <script>
        let editingId = null;
        let editingCompleted = false;
        let allTodos = [];
        let currentFilter = 'all';
        let calYear, calMonth;

        const today = new Date().toISOString().slice(0, 10);

        document.getElementById('today-label').textContent =
            new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

        function setFilter(filter, el) {
            currentFilter = filter;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderTodos();
        }

        function getStatus(todo) {
            if (todo.completed) return 'completed';
            if (!todo.end_date) return 'no-date';
            if (todo.end_date < today) return 'overdue';
            if (todo.end_date === today) return 'due-today';
            return 'on-track';
        }

        function badgeLabel(status, startDate, endDate) {
            const fmt = d => d ? d.replace(/-/g, '.') : '';
            if (status === 'no-date' || status === 'completed') {
                return startDate ? `<span class="date-badge no-date">▸ ${fmt(startDate)} ~</span>` : '';
            }
            const range = startDate ? `${fmt(startDate)} ≫ ${fmt(endDate)}` : `≫ ${fmt(endDate)}`;
            const map = { overdue: ['◆','OVERDUE'], 'due-today': ['◆','DUE TODAY'], 'on-track': ['◆',''] };
            const [icon, label] = map[status];
            return `<span class="date-badge ${status}">${icon}${label ? ' ' + label + ' ·' : ''} ${range}</span>`;
        }

        function updateStats() {
            document.getElementById('stat-total').textContent   = allTodos.length;
            document.getElementById('stat-done').textContent    = allTodos.filter(t => t.completed).length;
            document.getElementById('stat-overdue').textContent = allTodos.filter(t => !t.completed && t.end_date && t.end_date < today).length;
            document.getElementById('stat-today').textContent   = allTodos.filter(t => !t.completed && t.end_date === today).length;
        }

        function renderTodos() {
            let filtered = allTodos;
            if (currentFilter === 'active')  filtered = allTodos.filter(t => !t.completed);
            if (currentFilter === 'done')    filtered = allTodos.filter(t => t.completed);
            if (currentFilter === 'overdue') filtered = allTodos.filter(t => !t.completed && t.end_date && t.end_date < today);

            const list = document.getElementById('todo-list');
            list.innerHTML = '';

            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty">▸ NO ACTIVE MISSIONS ◂</div>';
                return;
            }

            filtered.forEach(todo => {
                const status = getStatus(todo);
                const card = document.createElement('div');
                card.className = 'todo-card' + (todo.completed ? ' completed' : status !== 'no-date' ? ` ${status}` : '');

                const commentsHtml = (todo.comments || [])
                    .map(c => `<div class="comment-item">▸ ${c.content}</div>`).join('');

                card.innerHTML = `
                    <div class="todo-header">
                        <div class="toggle ${todo.completed ? 'done' : ''}" onclick="toggleTodo(${todo.id})"></div>
                        <div class="todo-text">
                            <div class="todo-title">${todo.title}</div>
                            <div class="todo-desc">${todo.description}</div>
                            ${badgeLabel(status, todo.start_date, todo.end_date)}
                        </div>
                        <div class="todo-actions">
                            <button class="btn-icon btn-edit" onclick="openModal(${todo.id})">EDIT</button>
                            <button class="btn-icon btn-del" onclick="deleteTodo(${todo.id})">DISMISS</button>
                        </div>
                    </div>
                    <div class="comments-section">
                        ${commentsHtml}
                        <div class="comment-form">
                            <input id="comment-${todo.id}" placeholder="TRANSMIT REPORT / 보고 입력..." />
                            <button class="btn-comment" onclick="addComment(${todo.id})">SEND</button>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        async function fetchTodos() {
            const res = await fetch('/todos');
            allTodos = await res.json();
            updateStats();
            renderTodos();
            renderCalendar();
        }

        async function addTodo() {
            const title       = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const start_date  = document.getElementById('start_date').value || null;
            const end_date    = document.getElementById('end_date').value || null;
            if (!title) return;

            await fetch('/todos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: Date.now(), title, description, completed: false, start_date, end_date })
            });

            ['title','description','start_date','end_date'].forEach(id => document.getElementById(id).value = '');
            fetchTodos();
        }

        async function toggleTodo(id) {
            await fetch(`/todos/${id}/toggle`, { method: 'PATCH' });
            fetchTodos();
        }

        async function openModal(id) {
            const todo = allTodos.find(t => t.id === id);
            if (!todo) return;
            editingId = id;
            editingCompleted = todo.completed;
            document.getElementById('m-title').value = todo.title;
            document.getElementById('m-desc').value  = todo.description;
            document.getElementById('m-start').value = todo.start_date || '';
            document.getElementById('m-end').value   = todo.end_date || '';
            document.getElementById('modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('open');
            editingId = null;
        }

        async function saveEdit() {
            const title       = document.getElementById('m-title').value.trim();
            const description = document.getElementById('m-desc').value.trim();
            const start_date  = document.getElementById('m-start').value || null;
            const end_date    = document.getElementById('m-end').value || null;
            if (!title) return;

            await fetch(`/todos/${editingId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: editingId, title, description, completed: editingCompleted, start_date, end_date })
            });
            closeModal();
            fetchTodos();
        }

        async function deleteTodo(id) {
            if (!confirm('▶ DISMISS MISSION? / 정말 폐기할까요?')) return;
            await fetch(`/todos/${id}`, { method: 'DELETE' });
            fetchTodos();
        }

        async function addComment(todoId) {
            const input   = document.getElementById(`comment-${todoId}`);
            const content = input.value.trim();
            if (!content) return;
            await fetch(`/todos/${todoId}/comments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });
            input.value = '';
            fetchTodos();
        }

        function initCalendar() {
            const now = new Date();
            calYear  = now.getFullYear();
            calMonth = now.getMonth();
        }

        function changeMonth(delta) {
            calMonth += delta;
            if (calMonth > 11) { calMonth = 0; calYear++; }
            if (calMonth < 0)  { calMonth = 11; calYear--; }
            renderCalendar();
        }

        function renderCalendar() {
            const monthNames = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
            document.getElementById('month-label').textContent = `${calYear} ${monthNames[calMonth]}`;

            const grid = document.getElementById('cal-grid');
            grid.innerHTML = '';

            const firstDay = new Date(calYear, calMonth, 1).getDay();
            const lastDate = new Date(calYear, calMonth + 1, 0).getDate();
            const prevLast = new Date(calYear, calMonth, 0).getDate();

            const mergedMap = {};
            allTodos.forEach(todo => {
                const s = todo.start_date, e = todo.end_date;
                if (s && e && s === e) {
                    if (!mergedMap[s]) mergedMap[s] = [];
                    mergedMap[s].push({ todo, type: 'both' });
                } else {
                    if (s) { if (!mergedMap[s]) mergedMap[s] = []; mergedMap[s].push({ todo, type: 'start' }); }
                    if (e) { if (!mergedMap[e]) mergedMap[e] = []; mergedMap[e].push({ todo, type: 'end' }); }
                }
            });

            const totalCells = Math.ceil((firstDay + lastDate) / 7) * 7;

            for (let i = 0; i < totalCells; i++) {
                const cell = document.createElement('div');
                cell.className = 'cal-day';

                let dateStr, dayNum;

                if (i < firstDay) {
                    dayNum  = prevLast - firstDay + i + 1;
                    dateStr = `${calYear}-${String(calMonth).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
                    cell.classList.add('other-month');
                } else if (i >= firstDay + lastDate) {
                    dayNum  = i - firstDay - lastDate + 1;
                    dateStr = `${calYear}-${String(calMonth + 2).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
                    cell.classList.add('other-month');
                } else {
                    dayNum  = i - firstDay + 1;
                    dateStr = `${calYear}-${String(calMonth + 1).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`;
                    if (dateStr === today) cell.classList.add('today');
                }

                cell.innerHTML = `<span class="day-num">${dayNum}</span>`;

                const items = mergedMap[dateStr] || [];
                items.slice(0, 3).forEach(({ todo, type }) => {
                    const chip = document.createElement('span');
                    chip.className = `cal-todo-chip ${todo.completed ? 'done' : type}`;
                    chip.textContent = todo.title;
                    chip.title = todo.title;
                    cell.appendChild(chip);
                });

                if (items.length > 3) {
                    const more = document.createElement('span');
                    more.className = 'cal-todo-chip no-date';
                    more.textContent = `+${items.length - 3}`;
                    cell.appendChild(more);
                }

                grid.appendChild(cell);
            }
        }

        document.getElementById('modal').addEventListener('click', e => {
            if (e.target === e.currentTarget) closeModal();
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter' && document.activeElement.id === 'title') addTodo();
            if (e.key === 'Escape') closeModal();
        });

        initCalendar();
        fetchTodos();
    </script>
</body>
</html>
