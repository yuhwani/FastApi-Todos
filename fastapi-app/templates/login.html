<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPS COMMAND - Authentication</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-deep:   #11140c;
            --bg-base:   #1a1d14;
            --bg-card:   #262b1d;
            --bg-input:  #11140c;
            --border:    #4a5320;
            --border-hi: #8a9550;
            --text:      #d4dcb0;
            --text-dim:  #8a9265;
            --text-mute: #565c3e;
            --accent:    #a3b86c;
            --danger:    #b04d2c;
        }

        body {
            font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
            background:
                repeating-linear-gradient(0deg, transparent 0, transparent 24px, rgba(74,83,32,0.05) 24px, rgba(74,83,32,0.05) 25px),
                radial-gradient(ellipse at center, #1a1d14 0%, #0d0f08 100%);
            min-height: 100vh;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        /* ── CRT 스캔라인 오버레이 ── */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent 0,
                transparent 2px,
                rgba(163, 184, 108, 0.035) 2px,
                rgba(163, 184, 108, 0.035) 3px
            );
            z-index: 1000;
        }

        /* ── 부팅 시퀀스 오버레이 ── */
        .boot-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-deep);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            gap: 16px;
            animation: bootFade 0.5s 1.7s forwards;
        }

        @keyframes bootFade {
            to { opacity: 0; visibility: hidden; }
        }

        .boot-stamp {
            font-size: 9px;
            color: var(--danger);
            letter-spacing: 6px;
            font-weight: 800;
            border: 1px solid var(--danger);
            padding: 3px 12px;
            opacity: 0;
            animation: stampIn 0.3s 0.1s forwards;
        }

        @keyframes stampIn {
            from { opacity: 0; transform: scale(1.5); }
            to   { opacity: 1; transform: scale(1); }
        }

        .boot-text {
            font-size: 14px;
            color: var(--accent);
            letter-spacing: 4px;
            font-weight: 800;
            text-shadow: 0 0 16px rgba(163, 184, 108, 0.6);
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: typewriter 1.1s 0.4s steps(30) forwards;
            border-right: 8px solid var(--accent);
        }

        @keyframes typewriter {
            to { width: 30ch; }
        }

        .boot-cursor {
            display: inline-block;
            animation: blink 0.5s steps(2) infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .boot-progress {
            font-size: 10px;
            color: var(--text-mute);
            letter-spacing: 2px;
            opacity: 0;
            animation: progressIn 0.3s 1.5s forwards;
        }

        @keyframes progressIn {
            to { opacity: 1; }
        }

        /* ── 메인 콘텐츠 등장 애니메이션 ── */
        .auth-frame {
            width: 100%;
            max-width: 420px;
            opacity: 0;
            animation: contentReveal 0.8s 2.0s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes contentReveal {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
                filter: blur(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .classified-bar {
            background: var(--danger);
            color: #1a1d14;
            font-weight: 800;
            font-size: 10px;
            letter-spacing: 4px;
            text-align: center;
            padding: 4px 0;
            border: 2px solid var(--danger);
            animation: warningPulse 2.5s ease-in-out 3s infinite;
        }

        @keyframes warningPulse {
            0%, 100% { box-shadow: 0 0 0 rgba(176, 77, 44, 0); }
            50%      { box-shadow: 0 0 24px rgba(176, 77, 44, 0.45); }
        }

        .login-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-top: none;
            padding: 32px 28px;
            position: relative;
        }

        .login-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent);
        }

        .stencil-top {
            font-size: 9px;
            color: var(--text-mute);
            letter-spacing: 5px;
            text-align: center;
            margin-bottom: 8px;
        }

        /* ── 앉아있는 군인 (TASK BOARD 위) ── */
        .soldier-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 4px;
            margin-top: 4px;
        }

        .soldier {
            color: var(--accent);
            filter: drop-shadow(0 0 8px rgba(163, 184, 108, 0.35));
            animation: soldierBreath 4s ease-in-out 3s infinite;
        }

        @keyframes soldierBreath {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-2px); }
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 4px;
            text-shadow: 0 0 12px rgba(163, 184, 108, 0.3);
            animation: titleGlow 2.8s ease-in-out 3s infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 12px rgba(163, 184, 108, 0.3); }
            50%      { text-shadow: 0 0 28px rgba(163, 184, 108, 0.65), 0 0 8px rgba(163, 184, 108, 0.4); }
        }

        .subtitle {
            text-align: center;
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px dashed var(--border);
        }

        .subtitle::before { content: '── '; }
        .subtitle::after  { content: ' ──'; }

        .field-label {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: block;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            background: var(--bg-input);
            border: 1.5px solid var(--border);
            font-family: inherit;
            font-size: 13px;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input::placeholder { color: var(--text-mute); }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(163, 184, 108, 0.15);
        }

        button[type="submit"] {
            margin-top: 8px;
            padding: 12px 16px;
            background: var(--accent);
            color: #11140c;
            border: 2px solid var(--accent);
            font-family: inherit;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .gun-icon {
            flex-shrink: 0;
            transition: transform 0.15s;
        }

        button[type="submit"]:hover {
            background: transparent;
            color: var(--accent);
            box-shadow: inset 0 0 0 2px var(--accent);
        }

        button[type="submit"]:hover .gun-icon {
            transform: translateX(3px);
        }

        button[type="submit"]:active .gun-icon {
            transform: translateX(6px) rotate(-3deg);
        }

        .hint {
            margin-top: 20px;
            padding: 12px 14px;
            background: var(--bg-input);
            border: 1.5px dashed var(--border-hi);
            font-size: 11px;
            color: var(--text-dim);
            text-align: center;
            line-height: 1.6;
            letter-spacing: 1px;
        }

        .hint::before {
            content: '[ STANDARD CREDENTIALS ]';
            display: block;
            font-size: 9px;
            color: var(--accent);
            letter-spacing: 2px;
            margin-bottom: 6px;
            font-weight: 800;
        }

        .hint strong {
            color: var(--accent);
            font-weight: 800;
            background: rgba(163, 184, 108, 0.15);
            padding: 1px 6px;
        }

        .error {
            margin-top: 12px;
            padding: 10px 12px;
            background: rgba(176, 77, 44, 0.15);
            border: 1.5px solid var(--danger);
            color: var(--danger);
            font-size: 11px;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
            display: none;
        }

        .error.show { display: block; }

        .footer-bar {
            text-align: center;
            margin-top: 18px;
            font-size: 9px;
            color: var(--text-mute);
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <!-- 부팅 시퀀스 오버레이 (1.7초 후 사라짐) -->
    <div class="boot-screen">
        <div class="boot-stamp">// SECURE LINK ESTABLISHED //</div>
        <div class="boot-text">INITIALIZING TERMINAL<span class="boot-cursor">_</span></div>
        <div class="boot-progress">DECRYPTION ◆ AUTH PROTOCOL ◆ READY</div>
    </div>

    <div class="auth-frame">
        <div class="classified-bar">// RESTRICTED ACCESS // AUTHORIZED PERSONNEL ONLY //</div>

        <div class="login-card">
            <div class="stencil-top">[ AUTHENTICATION TERMINAL ]</div>

            <!-- 앉아있는 군인 (소총을 무릎 위에 가로로 들고 다리 늘어뜨림) -->
            <div class="soldier-wrap">
                <svg class="soldier" width="70" height="78" viewBox="0 0 64 72" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <!-- 헬멧 상단 -->
                    <path d="M14 16 Q14 4 32 4 Q50 4 50 16 Z"/>
                    <!-- 헬멧 챙 -->
                    <ellipse cx="32" cy="17" rx="20" ry="3"/>
                    <!-- 얼굴(헬멧 아래로 보이는 부분) -->
                    <rect x="24" y="19" width="16" height="7"/>
                    <!-- 헬멧 스트랩 -->
                    <line x1="26" y1="24" x2="38" y2="24" stroke="#11140c" stroke-width="1.2"/>
                    <!-- 상체(전술 베스트) -->
                    <rect x="18" y="26" width="28" height="20"/>
                    <!-- 베스트 중앙 라인 -->
                    <line x1="32" y1="26" x2="32" y2="46" stroke="#11140c" stroke-width="0.8" opacity="0.5"/>
                    <!-- 가슴 포켓 -->
                    <rect x="20" y="30" width="6" height="5" fill="#11140c" opacity="0.3"/>
                    <rect x="38" y="30" width="6" height="5" fill="#11140c" opacity="0.3"/>
                    <!-- 왼팔 -->
                    <rect x="10" y="28" width="8" height="16"/>
                    <!-- 오른팔 -->
                    <rect x="46" y="28" width="8" height="16"/>
                    <!-- 소총 (무릎 위에 가로로) -->
                    <rect x="4" y="40" width="56" height="2.5"/>
                    <rect x="48" y="38" width="6" height="5"/>
                    <rect x="28" y="36" width="2" height="4"/>
                    <!-- 벨트 -->
                    <rect x="16" y="44" width="32" height="2" fill="#11140c" opacity="0.4"/>
                    <!-- 양다리(아래로 늘어진 상태) -->
                    <rect x="20" y="46" width="10" height="20"/>
                    <rect x="34" y="46" width="10" height="20"/>
                    <!-- 군화 -->
                    <rect x="18" y="66" width="14" height="4"/>
                    <rect x="32" y="66" width="14" height="4"/>
                </svg>
            </div>

            <h1>✦ TASK BOARD</h1>
            <div class="subtitle">SECURE LOGIN / 인증 필요</div>

            <form method="POST" action="/login" autocomplete="off">
                <div class="field-group">
                    <label class="field-label">▶ OPERATIVE ID / 아이디</label>
                    <input type="text" name="username" placeholder="ENTER ID" required autofocus>
                </div>
                <div class="field-group">
                    <label class="field-label">▶ ACCESS CODE / 비밀번호</label>
                    <input type="password" name="password" placeholder="ENTER PASSCODE" required>
                </div>
                <button type="submit">
                    <!-- 권총 아이콘 (총구가 오른쪽을 향함) -->
                    <svg class="gun-icon" width="24" height="14" viewBox="0 0 24 14" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <!-- 총열 (Slide) -->
                        <rect x="0" y="4" width="18" height="3"/>
                        <!-- 가늠쇠 (Front sight) -->
                        <rect x="14" y="3" width="2" height="1"/>
                        <!-- 공이치기 (Hammer) -->
                        <rect x="18" y="2" width="2" height="3"/>
                        <!-- 방아쇠울 (Trigger guard) -->
                        <rect x="8" y="7" width="4" height="2"/>
                        <!-- 손잡이 (Grip) -->
                        <polygon points="12,7 18,7 16,14 10,14"/>
                    </svg>
                    MISSION START / 임무 시작
                </button>
            </form>

            <div class="error" id="error">▶ ACCESS DENIED / 신원 확인 실패</div>

            <div class="hint">
                ID: <strong>admin</strong> &nbsp; / &nbsp; PW: <strong>admin</strong>
            </div>
        </div>

        <div class="footer-bar">── SYSTEM v1.0 // OPS COMMAND ──</div>
    </div>

    <script>
        if (new URLSearchParams(location.search).get("error") === "1") {
            document.getElementById("error").classList.add("show");
        }
    </script>
</body>
</html>
