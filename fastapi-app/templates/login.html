<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPS COMMAND - Authentication</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-deep:   #11140c;
            --bg-base:   #1a1d14;
            --bg-card:   #262b1d;
            --bg-input:  #11140c;
            --border:    #4a5320;
            --border-hi: #8a9550;
            --text:      #d4dcb0;
            --text-dim:  #8a9265;
            --text-mute: #565c3e;
            --accent:    #a3b86c;
            --danger:    #b04d2c;
        }

        body {
            font-family: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
            background:
                repeating-linear-gradient(0deg, transparent 0, transparent 24px, rgba(74,83,32,0.05) 24px, rgba(74,83,32,0.05) 25px),
                radial-gradient(ellipse at center, #1a1d14 0%, #0d0f08 100%);
            min-height: 100vh;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-frame {
            width: 100%;
            max-width: 420px;
        }

        .classified-bar {
            background: var(--danger);
            color: #1a1d14;
            font-weight: 800;
            font-size: 10px;
            letter-spacing: 4px;
            text-align: center;
            padding: 4px 0;
            border: 2px solid var(--danger);
        }

        .login-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-top: none;
            padding: 32px 28px;
            position: relative;
        }

        .login-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent);
        }

        .stencil-top {
            font-size: 9px;
            color: var(--text-mute);
            letter-spacing: 5px;
            text-align: center;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 4px;
            text-shadow: 0 0 12px rgba(163, 184, 108, 0.3);
        }

        .subtitle {
            text-align: center;
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px dashed var(--border);
        }

        .subtitle::before { content: '── '; }
        .subtitle::after  { content: ' ──'; }

        .field-label {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: block;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            background: var(--bg-input);
            border: 1.5px solid var(--border);
            font-family: inherit;
            font-size: 13px;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s;
        }

        input::placeholder { color: var(--text-mute); }
        input:focus { border-color: var(--accent); }

        button[type="submit"] {
            margin-top: 8px;
            padding: 12px;
            background: var(--accent);
            color: #11140c;
            border: 2px solid var(--accent);
            font-family: inherit;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        button[type="submit"]:hover {
            background: transparent;
            color: var(--accent);
            box-shadow: inset 0 0 0 2px var(--accent);
        }

        .hint {
            margin-top: 20px;
            padding: 12px 14px;
            background: var(--bg-input);
            border: 1.5px dashed var(--border-hi);
            font-size: 11px;
            color: var(--text-dim);
            text-align: center;
            line-height: 1.6;
            letter-spacing: 1px;
        }

        .hint::before {
            content: '[ STANDARD CREDENTIALS ]';
            display: block;
            font-size: 9px;
            color: var(--accent);
            letter-spacing: 2px;
            margin-bottom: 6px;
            font-weight: 800;
        }

        .hint strong {
            color: var(--accent);
            font-weight: 800;
            background: rgba(163, 184, 108, 0.15);
            padding: 1px 6px;
        }

        .error {
            margin-top: 12px;
            padding: 10px 12px;
            background: rgba(176, 77, 44, 0.15);
            border: 1.5px solid var(--danger);
            color: var(--danger);
            font-size: 11px;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
            display: none;
        }

        .error.show { display: block; }

        .footer-bar {
            text-align: center;
            margin-top: 18px;
            font-size: 9px;
            color: var(--text-mute);
            letter-spacing: 3px;
        }
    </style>
</head>
<body>
    <div class="auth-frame">
        <div class="classified-bar">// RESTRICTED ACCESS // AUTHORIZED PERSONNEL ONLY //</div>

        <div class="login-card">
            <div class="stencil-top">[ AUTHENTICATION TERMINAL ]</div>
            <h1>✦ TASK BOARD</h1>
            <div class="subtitle">SECURE LOGIN / 인증 필요</div>

            <form method="POST" action="/login" autocomplete="off">
                <div class="field-group">
                    <label class="field-label">▶ OPERATIVE ID / 아이디</label>
                    <input type="text" name="username" placeholder="ENTER ID" required autofocus>
                </div>
                <div class="field-group">
                    <label class="field-label">▶ ACCESS CODE / 비밀번호</label>
                    <input type="password" name="password" placeholder="ENTER PASSCODE" required>
                </div>
                <button type="submit">▶ MISSION START / 임무 시작</button>
            </form>

            <div class="error" id="error">▶ ACCESS DENIED / 신원 확인 실패</div>

            <div class="hint">
                ID: <strong>admin</strong> &nbsp; / &nbsp; PW: <strong>admin</strong>
            </div>
        </div>

        <div class="footer-bar">── SYSTEM v1.0 // OPS COMMAND ──</div>
    </div>

    <script>
        if (new URLSearchParams(location.search).get("error") === "1") {
            document.getElementById("error").classList.add("show");
        }
    </script>
</body>
</html>
